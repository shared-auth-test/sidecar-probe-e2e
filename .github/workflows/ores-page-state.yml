name: ores page state ABI

on:
  push:
    branches:
      - test/ores-page-state
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-auth-test-ores-page-state
  cancel-in-progress: true

jobs:
  page-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Shared Auth test consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Check out api-docs client authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/api-docs
          ref: DEN-3960-rust-fs-routing
          path: deps/api-docs
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Run typed PageContext and PrerenderContext state smoke
        run: cargo run --manifest-path certification/ores-page-state/Cargo.toml
