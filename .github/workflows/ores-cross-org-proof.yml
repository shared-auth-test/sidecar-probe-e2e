name: wasmx exact-head funded test proof

on:
  push:
    branches:
      - proof/ores-cross-org-20260928
    paths:
      - '.github/workflows/ores-cross-org-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WASMX_SHA: 6b5bab8275daa36daf7918541b70c9f8e2122f9a

jobs:
  wasmx-rust:
    name: wasmx-rust-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact wasmx head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: wasm-xprs/wasmx-desktop-daemon
          ref: ${{ env.WASMX_SHA }}
          path: wasmx
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact wasmx head
        shell: bash
        run: test "$(git -C wasmx rev-parse HEAD)" = "$WASMX_SHA"
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        working-directory: wasmx
        run: cargo fmt --all -- --check
      - name: Check
        working-directory: wasmx
        run: cargo check --all-targets
      - name: Test
        working-directory: wasmx
        run: cargo test --all-targets
      - name: Clippy
        if: matrix.os != 'windows-2025'
        working-directory: wasmx
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (Windows cfg)
        if: matrix.os == 'windows-2025'
        working-directory: wasmx
        run: cargo clippy --all-targets -- -D warnings -A unused-variables
